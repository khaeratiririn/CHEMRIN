<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry Learning With Ibu Ririn</title>
    <!-- Tailwind CSS CDN -->

    <!-- FontAwesome Icons for Chemistry and UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for Excel Import/Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        chemYellowLight: '#FEF08A', // Yellow 200
                        chemYellow: '#FACC15',      // Yellow 400
                        chemYellowDark: '#EAB308',  // Yellow 500
                        chemYellowDeep: '#CA8A04',  // Yellow 600
                        chemCream: '#FEFCE8',       // Yellow 50
                        chemGold: '#D97706',        // Amber 600
                        chemGreen: '#10B981',
                        chemRed: '#EF4444'

                    boxShadow: {
                        'soft': '0 10px 25px -5px rgba(234, 179, 8, 0.2), 0 8px 10px -6px rgba(234, 179, 8, 0.1)',
                        'card': '0 4px 20px -2px rgba(0, 0, 0, 0.04)',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FEFCE8;
        }
        .float-animation {
            animation: floating 4s ease-in-out infinite;
        }
        .float-delay-1 {
            animation: floating 5s ease-in-out 1s infinite;
        }
        .float-delay-2 {
            animation: floating 4.5s ease-in-out 2s infinite;
        }
        @keyframes floating {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #FEF08A;
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #EAB308;
            border-radius: 9999px;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased selection:bg-yellow-300 selection:text-yellow-950">

    <!-- FLOATING BACKGROUND DECORATIVE ICONS -->
    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0 opacity-20">
        <i class="fa-solid fa-atom text-6xl text-yellow-600 absolute top-12 left-10 float-animation"></i>
        <i class="fa-solid fa-flask text-5xl text-yellow-500 absolute top-1/4 right-12 float-delay-1"></i>
        <i class="fa-solid fa-vial text-6xl text-amber-600 absolute bottom-20 left-16 float-delay-2"></i>
        <i class="fa-solid fa-dna text-7xl text-yellow-600 absolute bottom-10 right-20 float-animation"></i>
    </div>

    <!-- MAIN NAVBAR -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-yellow-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- LOGO & BRAND -->
                <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
                    <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-yellow-400 via-amber-400 to-yellow-500 flex items-center justify-center text-slate-900 text-2xl shadow-md shadow-yellow-400/40 transform transition hover:scale-105">
                        <i class="fa-solid fa-flask"></i>
                    </div>
                    <div>
                        <span class="text-lg sm:text-xl font-black bg-gradient-to-r from-yellow-700 via-amber-700 to-yellow-900 bg-clip-text text-transparent block leading-tight">Chemistry Learning</span>
                        <span class="text-xs font-extrabold text-amber-800 tracking-wider">WITH IBU RIRIN</span>
                    </div>
                </div>

                <!-- DESKTOP NAVIGATION -->
                <nav class="hidden md:flex items-center gap-1 bg-yellow-100/70 p-1.5 rounded-2xl border border-yellow-300/60">
                    <button onclick="navigateTo('home')" id="nav-home" class="nav-link px-4 py-2 rounded-xl text-xs font-extrabold transition-all">Beranda</button>
                    <button onclick="navigateTo('profile')" id="nav-profile" class="nav-link px-4 py-2 rounded-xl text-xs font-extrabold transition-all">Profil Guru</button>
                    <button onclick="navigateTo('semester', {sem: 1})" id="nav-sem1" class="nav-link px-4 py-2 rounded-xl text-xs font-extrabold transition-all">Sem. Ganjil</button>
                    <button onclick="navigateTo('semester', {sem: 2})" id="nav-sem2" class="nav-link px-4 py-2 rounded-xl text-xs font-extrabold transition-all">Sem. Genap</button>
                    <button onclick="navigateTo('grades')" id="nav-grades" class="nav-link px-4 py-2 rounded-xl text-xs font-extrabold transition-all">Daftar Nilai</button>
                </nav>

                <!-- RIGHT ACTION BUTTON (LOGIN / DASHBOARD) -->
                <div class="hidden md:flex items-center gap-3">
                    <button id="auth-btn" onclick="handleAuthAction()" class="px-5 py-2.5 rounded-xl font-extrabold text-xs bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-slate-950 shadow-md shadow-yellow-400/30 transition-all flex items-center gap-2 transform active:scale-95">
                        <i class="fa-solid fa-lock" id="auth-icon"></i>
                        <span id="auth-label">Login Guru</span>
                    </button>
                </div>

                <!-- MOBILE MENU BUTTON -->
                <div class="flex md:hidden">
                    <button onclick="toggleMobileMenu()" class="p-2.5 rounded-xl bg-yellow-200/80 text-yellow-950 hover:bg-yellow-300 transition-colors">
                        <i class="fa-solid fa-bars text-xl" id="mobile-menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- MOBILE DROPDOWN MENU -->
        <div id="mobile-menu" class="hidden md:hidden border-b border-yellow-200 bg-white px-4 pt-2 pb-6 space-y-2 shadow-xl">
            <button onclick="navigateTo('home')" class="w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-yellow-50 text-slate-800 flex items-center gap-3"><i class="fa-solid fa-house text-yellow-600"></i> Beranda</button>
            <button onclick="navigateTo('profile')" class="w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-yellow-50 text-slate-800 flex items-center gap-3"><i class="fa-solid fa-user-tie text-yellow-600"></i> Profil Guru</button>
            <button onclick="navigateTo('semester', {sem: 1})" class="w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-yellow-50 text-slate-800 flex items-center gap-3"><i class="fa-solid fa-book-open text-yellow-600"></i> Semester Ganjil</button>
            <button onclick="navigateTo('semester', {sem: 2})" class="w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-yellow-50 text-slate-800 flex items-center gap-3"><i class="fa-solid fa-bookmark text-yellow-600"></i> Semester Genap</button>
            <button onclick="navigateTo('grades')" class="w-full text-left px-4 py-3 rounded-xl font-bold hover:bg-yellow-50 text-slate-800 flex items-center gap-3"><i class="fa-solid fa-chart-line text-yellow-600"></i> Status Nilai Siswa</button>
            <div class="pt-2">
                <button id="mobile-auth-btn" onclick="handleAuthAction()" class="w-full py-3 rounded-xl font-extrabold bg-yellow-400 text-slate-950 flex items-center justify-center gap-2 shadow-md">
                    <i class="fa-solid fa-lock" id="mobile-auth-icon"></i>
                    <span id="mobile-auth-label">Login Guru</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN DYNAMIC CONTENT CONTAINER -->
    <main id="app-content" class="flex-grow z-10 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Dynamic Content Renders Here -->
    </main>

    <!-- FOOTER -->
    <footer class="bg-gradient-to-b from-yellow-50 to-yellow-100 border-t border-yellow-300/80 mt-12 py-8 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center space-y-4">
            <div class="flex items-center justify-center gap-2">
                <span class="w-8 h-8 rounded-full bg-yellow-400 inline-flex items-center justify-center text-slate-900 font-bold"><i class="fa-solid fa-atom"></i></span>
                <span class="font-black text-yellow-950 text-lg">Chemistry Learning With Ibu Ririn</span>
            </div>
            <p class="text-xs sm:text-sm text-slate-600 max-w-lg mx-auto">
                Platform pembelajaran Kimia interaktif, modern, dan ceria untuk mendukung semangat belajar siswa SMA.
            </p>
            <div class="pt-4 border-t border-yellow-300/60 text-xs text-slate-600 flex flex-col sm:flex-row justify-between items-center gap-2">
                <p>&copy; 2026 Chemistry Learning With Ibu Ririn. All rights reserved.</p>
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                    <span id="sync-status-indicator" class="font-bold">Sistem Aktif</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- NOTIFICATION TOAST -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MODAL CONTAINER (DYNAMIC) -->
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-box" class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-yellow-300 transform transition-all scale-95 opacity-0 overflow-y-auto max-h-[90vh]">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <!-- APP SCRIPT INCLUDING FIREBASE MODULES -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, doc, setDoc, onSnapshot, collection 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global State
        window.AppState = {
            currentUser: null,
            isTeacher: false,
            teacherPassword: localStorage.getItem('chem_teacher_password') || "admin123", // Secure storage
            currentView: 'home',
            viewParams: {},
            db: null,
            auth: null,
            appId: typeof __app_id !== 'undefined' ? __app_id : 'chem-learning-ibu-ririn-app',
            
            // Dynamic Data (Synced)
            profile: {
                name: "Ibu Ririn, S.Pd., M.Si.",
                school: "SMA Negeri Pembelajaran",
                subject: "Kimia SMA",
                photoUrl: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=600",
                bio: "Guru Kimia yang berdedikasi menciptakan pembelajaran Kimia yang ceria, mudah dipahami, konseptual, dan interaktif bagi peserta didik SMA.",
                email: "ririn.chemistry@sekolah.sch.id",
                officeHours: "Senin - Jumat (07.30 - 15.30 WIB)"
            },
            announcements: [
                { id: '1', date: "28 Oktober 2026", title: "Asesmen Sumatif Bab Struktur Atom", content: "Persiapkan diri Anda untuk mengerjakan Asesmen Sumatif Struktur Atom di Pertemuan 4.", badge: "Penting" },
                { id: '2', date: "25 Oktober 2026", title: "Tugas Video Praktikum Reaksi Redoks", content: "Kumpulkan video singkat percobaan reaksi redoks sederhana sebelum hari Jumat.", badge: "Tugas" }
            ],
            meetings: {}, 
            classes: [
                { id: 'X.1', name: "X.1", capacity: 22, level: "X" },
                { id: 'X.2', name: "X.2", capacity: 21, level: "X" },
                { id: 'X.3', name: "X.3", capacity: 21, level: "X" },
                { id: 'X.4', name: "X.4", capacity: 30, level: "X" },
                { id: 'X.5', name: "X.5", capacity: 31, level: "X" },
                { id: 'X.6', name: "X.6", capacity: 20, level: "X" }
            ],
            students: [],
            grades: {}
        };

        // Initialize 32 Default Meetings (16 Ganjil + 16 Genap)
        function initDefaultMeetings() {
            const result = {};
            const ganjilTitles = [
                "Pengenalan Ilmu Kimia & Keselamatan Kerja Lab",
                "Struktur Atom & Model Atom Modern",
                "Konfigurasi Elektron & Bilangan Kuantum",
                "Sistem Periodik Unsur & Sifat Keperiodikan",
                "Ikatan Ion & Ikatan Kovalen",
                "Bentuk Molekul & Teori VSEPR",
                "Gaya Antarmolekul & Sifat Fisik Zat",
                "Tata Nama Senyawa Anorganik",
                "Persamaan Reaksi Kimia",
                "Hukum Dasar Kimia (Lavoisier & Proust)",
                "Hukum Gay-Lussac & Avogadro",
                "Konsep Mol & Massa Molar",
                "Stoikiometri Reaksi Kimia",
                "Pereaksi Pembatas dalam Reaksi",
                "Rumus Empiris & Rumus Molekul",
                "Kadar Zat dalam Campuran & Evaluasi Semester"
            ];

            const genapTitles = [
                "Larutan Elektrolit & Non-Elektrolit",
                "Konsep Reaksi Oksidasi & Reduksi (Redoks)",
                "Tata Nama Senyawa Redoks & Biloks",
                "Tatanama & Penggolongan Senyawa Hidrokarbon",
                "Isomer Senyawa Hidrokarbon",
                "Sifat Fisik & Kimia Alkana, Alkena, Alkuna",
                "Minyak Bumi & Fraksi Minyak Bumi",
                "Mutu Bensin & Pembakaran Hidrokarbon",
                "Termokimia & Perubahan Entalpi Reaksi",
                "Penentuan Entalpi: Kalorimetri & Hukum Hess",
                "Laju Reaksi & Teori Tumbukan",
                "Faktor-Faktor yang Memengaruhi Laju Reaksi",
                "Kesetimbangan Kimia & Pergeseran Kesetimbangan",
                "Tetapan Kesetimbangan (Kc dan Kp)",
                "Aplikasi Kesetimbangan dalam Industri",
                "Review Akhir Tahun & Evaluasi Semester Genap"
            ];

            for (let i = 1; i <= 16; i++) {
                result[`sem1_m${i}`] = {
                    id: `sem1_m${i}`,
                    semester: 1,
                    number: i,
                    title: `Pertemuan ${i}: ${ganjilTitles[i-1]}`,
                    objective: `Peserta didik mampu memahami konsep ${ganjilTitles[i-1]} serta mengaplikasikannya dalam penyelesaian masalah Kimia dasar secara kontekstual.`,
                    pptUrl: "https://docs.google.com/presentation/d/e/2PACX-1vQn3-example/embed",
                    videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
                    formsUrl: "",
                    active: true
                };

                result[`sem2_m${i}`] = {
                    id: `sem2_m${i}`,
                    semester: 2,
                    number: i,
                    title: `Pertemuan ${i}: ${genapTitles[i-1]}`,
                    objective: `Peserta didik dapat menganalisis ${genapTitles[i-1]} dengan sikap kritis dan komunikatif bersama Ibu Ririn.`,
                    pptUrl: "",
                    videoUrl: "",
                    formsUrl: "",
                    active: true
                };
            }
            return result;
        }

        window.AppState.meetings = initDefaultMeetings();

        // 20 Grade Components Definition
        window.GradeComponents = [
            ...Array.from({length: 16}, (_, i) => ({ id: `asm_${i+1}`, label: `Asesmen ${i+1}`, type: 'asm' })),
            { id: 'uh_1', label: 'Ujian Harian 1', type: 'uh' },
            { id: 'uh_2', label: 'Ujian Harian 2', type: 'uh' },
            { id: 'uts', label: 'UTS', type: 'exam' },
            { id: 'uas', label: 'UAS', type: 'exam' }
        ];

        // Setup Firebase Engine
        async function setupFirebase() {
            try {
                const firebaseConfig = typeof __firebase_config !== 'undefined' 
                    ? JSON.parse(__firebase_config) 
                    : { apiKey: "demo-key", authDomain: "demo.firebaseapp.com", projectId: "demo-project" };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);

                window.AppState.auth = auth;
                window.AppState.db = db;

                onAuthStateChanged(auth, async (user) => {
                    window.AppState.currentUser = user;
                    updateAuthUI();
                });

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token).catch(() => signInAnonymously(auth));
                } else {
                    await signInAnonymously(auth).catch(() => console.log("Running in local mode."));
                }

                attachDataListeners();
            } catch (err) {
                console.warn("Running in local mode.", err);
                document.getElementById('sync-status-indicator').innerText = "Mode Lokal Aktif";
            }
        }

        function getCollectionPath(collName) {
            return collection(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', collName);
        }

        function attachDataListeners() {
            if (!window.AppState.db) return;

            onSnapshot(getCollectionPath('app_settings'), (snapshot) => {
                snapshot.forEach(docSnap => {
                    if (docSnap.id === 'profile') window.AppState.profile = { ...window.AppState.profile, ...docSnap.data() };
                    if (docSnap.id === 'announcements') window.AppState.announcements = docSnap.data().list || [];
                    if (docSnap.id === 'security') {
                        if (docSnap.data().password) {
                            window.AppState.teacherPassword = docSnap.data().password;
                            localStorage.setItem('chem_teacher_password', docSnap.data().password);
                        }
                    }
                });
                renderCurrentView();
            });

            onSnapshot(getCollectionPath('app_meetings'), (snapshot) => {
                snapshot.forEach(docSnap => {
                    if (docSnap.id === 'all') window.AppState.meetings = docSnap.data().data || window.AppState.meetings;
                });
                renderCurrentView();
            });

            onSnapshot(getCollectionPath('app_classes'), (snapshot) => {
                let loadedClasses = [];
                snapshot.forEach(docSnap => {
                    if (docSnap.id === 'list') loadedClasses = docSnap.data().classes;
                });
                if (loadedClasses.length > 0) window.AppState.classes = loadedClasses;
                renderCurrentView();
            });

            onSnapshot(getCollectionPath('app_students'), (snapshot) => {
                snapshot.forEach(docSnap => {
                    if (docSnap.id === 'roster') window.AppState.students = docSnap.data().list || [];
                    if (docSnap.id === 'grades') window.AppState.grades = docSnap.data().records || {};
                });
                renderCurrentView();
            });
        }

        window.saveDataToStore = async function(collectionKey, docId, dataObject) {
            if (!window.AppState.db || !window.AppState.currentUser) {
                showToast("Perubahan tersimpan secara lokal!", "success");
                renderCurrentView();
                return;
            }
            try {
                const docRef = doc(window.AppState.db, 'artifacts', window.AppState.appId, 'public', 'data', collectionKey, docId);
                await setDoc(docRef, dataObject, { merge: true });
                showToast("Data tersimpan!", "success");
            } catch (e) {
                showToast("Tersimpan di perangkat ini.", "warning");
                renderCurrentView();
            }
        };

        window.navigateTo = function(view, params = {}) {
            window.AppState.currentView = view;
            window.AppState.viewParams = params;
            
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.classList.remove('bg-yellow-400', 'text-slate-950', 'shadow-sm');
                btn.classList.add('text-slate-800', 'hover:bg-yellow-200/60');
            });

            if (view === 'home') document.getElementById('nav-home')?.classList.add('bg-yellow-400', 'text-slate-950');
            if (view === 'profile') document.getElementById('nav-profile')?.classList.add('bg-yellow-400', 'text-slate-950');
            if (view === 'semester' && params.sem === 1) document.getElementById('nav-sem1')?.classList.add('bg-yellow-400', 'text-slate-950');
            if (view === 'semester' && params.sem === 2) document.getElementById('nav-sem2')?.classList.add('bg-yellow-400', 'text-slate-950');
            if (view === 'grades') document.getElementById('nav-grades')?.classList.add('bg-yellow-400', 'text-slate-950');

            document.getElementById('mobile-menu').classList.add('hidden');
            renderCurrentView();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.handleAuthAction = function() {
            if (window.AppState.isTeacher) {
                window.AppState.isTeacher = false;
                showToast("Keluar dari mode Guru", "info");
                updateAuthUI();
                navigateTo('home');
            } else {
                showLoginModal();
            }
        };

        function updateAuthUI() {
            const label = window.AppState.isTeacher ? "Dashboard Guru" : "Login Guru";
            const icon = window.AppState.isTeacher ? "fa-solid fa-chalkboard-user" : "fa-solid fa-lock";
            
            document.getElementById('auth-label').innerText = label;
            document.getElementById('auth-icon').className = icon;
            document.getElementById('mobile-auth-label').innerText = label;
            document.getElementById('mobile-auth-icon').className = icon;

            const btn = document.getElementById('auth-btn');
            if (window.AppState.isTeacher) {
                btn.className = "px-5 py-2.5 rounded-xl font-extrabold text-xs bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 shadow-md transition-all flex items-center gap-2 transform active:scale-95";
            } else {
                btn.className = "px-5 py-2.5 rounded-xl font-extrabold text-xs bg-gradient-to-r from-yellow-400 to-amber-500 hover:from-yellow-500 hover:to-amber-600 text-slate-950 shadow-md shadow-yellow-400/30 transition-all flex items-center gap-2 transform active:scale-95";
            }
        }

        // NO SPOILED/PLAIN PASSWORD IN MODAL (SECURE)
        function showLoginModal() {
            showModal(`
                <div class="text-center space-y-4">
                    <div class="w-16 h-16 rounded-3xl bg-yellow-100 text-yellow-700 flex items-center justify-center text-3xl mx-auto shadow-inner">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-black text-slate-800">Autentikasi Guru</h3>
                        <p class="text-xs text-slate-500 mt-1">Masukkan kata sandi khusus guru untuk membuka Dashboard Administrasi.</p>
                    </div>
                    <form onsubmit="verifyTeacherLogin(event)" class="space-y-4 pt-2 text-left">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Kata Sandi Guru</label>
                            <input type="password" id="teacher-password" class="w-full px-4 py-3 rounded-xl border border-yellow-300 focus:ring-2 focus:ring-yellow-400 outline-none transition font-bold" placeholder="Masukkan password..." required />
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition">Batal</button>
                            <button type="submit" class="flex-1 py-3 rounded-xl font-extrabold bg-yellow-400 hover:bg-yellow-500 text-slate-950 shadow-md transition">Masuk Dashboard</button>
                        </div>
                    </form>
                </div>
            `);
        }

        window.verifyTeacherLogin = function(e) {
            e.preventDefault();
            const pass = document.getElementById('teacher-password').value;
            if (pass === window.AppState.teacherPassword) {
                window.AppState.isTeacher = true;
                updateAuthUI();
                closeModal();
                showToast("Selamat datang Ibu Ririn! Mode Guru Aktif.", "success");
                navigateTo('dashboard');

        window.saveBatchGrades = function(classId) {
            const inputs = document.querySelectorAll('.grade-input');
            const selectedCompId = window.AppState.viewParams.selectedComp || 'asm_1';

            inputs.forEach(inp => {
                const sId = inp.dataset.studentid;
                const rawVal = inp.value;

                if (!window.AppState.grades[sId]) window.AppState.grades[sId] = {};

                if (rawVal === '') {
                    delete window.AppState.grades[sId][selectedCompId];
                } else {
                    const num = parseFloat(rawVal);
                    if (num >= 0 && num <= 100) {
                        window.AppState.grades[sId][selectedCompId] = num;
                    }
                }
            });

            window.saveDataToStore('app_students', 'grades', { records: window.AppState.grades });
        };

        // EXCEL EXPORT
        window.exportClassToExcel = function(classId) {
            const students = window.AppState.students.filter(s => s.classId === classId);
            const data = students.map(s => {
                const row = { NIS: s.nis || '', Nama: s.name, Kelas: s.classId };
                const stG = window.AppState.grades[s.id] || {};
                window.GradeComponents.forEach(c => {
                    row[c.label] = stG[c.id] !== undefined ? stG[c.id] : '';
                });
                return row;
            });

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `Kelas_${classId}`);
            XLSX.writeFile(workbook, `Rekap_Nilai_Kimia_Kelas_${classId}.xlsx`);
        };

            backdrop.classList.remove('hidden');
            setTimeout(() => {
                box.classList.remove('scale-95', 'opacity-0');
                box.classList.add('scale-100', 'opacity-100');
            }, 10);
        };

        window.closeModal = function() {
            const backdrop = document.getElementById('modal-backdrop');
            const box = document.getElementById('modal-box');
            box.classList.remove('scale-100', 'opacity-100');
            box.classList.add('scale-95', 'opacity-0');
            setTimeout(() => backdrop.classList.add('hidden'), 200);
        };

            let bg = "bg-slate-800 text-white";
            if (type === "success") bg = "bg-emerald-600 text-white";
            if (type === "warning") bg = "bg-amber-600 text-white";
            if (type === "error") bg = "bg-rose-600 text-white";

            toast.className = `px-5 py-3 rounded-2xl shadow-xl font-bold text-xs flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0 ${bg}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // ON LOAD
        window.onload = function() {
            setupFirebase();
            navigateTo('home');
        };
    </script>
</body>
</html>
